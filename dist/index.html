<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parabéns, seu site está no ar!</title>
  <meta name="description" content="Você colocou um site no ar em um servidor de verdade. Parabéns!">
  <meta name="theme-color" content="#0e2230">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e2230'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f59a23'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/bricolage.a97804dc9f.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("assets/bricolage.a97804dc9f.woff2") format("woff2");
      font-weight: 200 800;
      font-display: swap;
    }

    :root {
      --ink: #0e2230;
      --ink-soft: #40586a;
      --paper: #e8eff3;
      --window: #0b1a25;
      --amber: #f59a23;
      --amber-deep: #b8620a;
      --sea: #1f7a8c;
      --ok: #7be0a6;
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Bricolage Grotesque", ui-rounded, "Avenir Next", system-ui, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.55;
      display: grid;
      align-items: center;
    }

    main {
      width: min(1120px, 100% - 2rem);
      margin-inline: auto;
      padding-block: clamp(1.5rem, 5vw, 4rem);
      display: grid;
      gap: clamp(1.75rem, 4vw, 3.5rem);
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
    }

    @media (min-width: 880px) {
      main { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 8.2vw, 5.6rem);
      font-weight: 800;
      line-height: 0.96;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .lead {
      margin: 1.4rem 0 0;
      max-width: 34rem;
      color: var(--ink-soft);
      font-size: clamp(1.05rem, 2.2vw, 1.2rem);
      text-wrap: pretty;
    }

    .actions { margin-top: 2rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.9rem 1.1rem; }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      color: var(--ink);
      background: var(--amber);
      padding: 0.8rem 1.35rem;
      border-radius: 999px;
      box-shadow: 0 2px 0 var(--amber-deep);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--amber-deep); }
    button:active { transform: translateY(2px); box-shadow: 0 0 0 var(--amber-deep); }
    button:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; }

    .feedback { min-height: 1.5em; color: var(--sea); font-weight: 600; }

    /* A janela de terminal é o elemento principal da página */
    .window {
      margin: 0;
      background: var(--window);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 28px 60px -24px rgba(14, 34, 48, 0.55);
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0.9rem;
      background: #12293a;
      color: #a9bccb;
      font-size: 0.875rem;
    }
    .bar i { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: #2c4558; flex: none; }
    .bar i:first-child { background: var(--amber); }
    .bar span { margin-left: 0.4rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .window img { display: block; width: 100%; height: auto; aspect-ratio: 498 / 485; background: #1a1a1a; }

    dl {
      margin: 0;
      padding: 0.9rem 1rem 1rem;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.3rem 1.25rem;
      color: #c6d5e0;
      font-size: 0.9375rem;
    }
    dt { color: #7f98aa; }
    dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    dd.ok { color: var(--ok); font-weight: 700; }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1 id="titulo">Parabéns! Seu site está no ar.</h1>
      <p class="lead">
        Você pegou um servidor vazio, instalou o que faltava e colocou uma página
        que qualquer pessoa abre no navegador. Isso é deploy de verdade.
      </p>
      <div class="actions">
        <button type="button" id="copiar">Copiar o endereço</button>
        <span class="feedback" id="feedback" role="status" aria-live="polite"></span>
      </div>
    </section>

    <figure class="window" aria-labelledby="titulo">
      <div class="bar" aria-hidden="true"><i></i><i></i><i></i><span id="host">servidor</span></div>
      <picture>
        <source media="(prefers-reduced-motion: reduce)" srcset="assets/gatinhos-parado.34a6e9e0b9.jpg">
        <img src="assets/gatinhos.7e7f5cc5f4.gif" width="498" height="485"
             alt="Dois gatinhos filhotes dançando lado a lado, comemorando">
      </picture>
      <dl>
        <dt>Endereço</dt><dd id="endereco">-</dd>
        <dt>Resposta</dt><dd id="status" class="ok">200 OK</dd>
        <dt>Tempo</dt><dd id="tempo">-</dd>
      </dl>
    </figure>
  </main>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var host = location.host || "servidor";

      $("host").textContent = host;
      $("endereco").textContent = location.protocol === "file:" ? "arquivo local" : location.origin;

      // Personaliza com ?nome=Maria (só texto, nunca HTML)
      try {
        var nome = (new URLSearchParams(location.search).get("nome") || "").trim().slice(0, 40);
        if (nome) $("titulo").textContent = "Parabéns, " + nome + "! Seu site está no ar.";
      } catch (e) {}

      // Dados reais da resposta que o navegador acabou de receber
      try {
        var nav = performance.getEntriesByType("navigation")[0];
        if (nav && nav.responseStart > 0) {
          $("tempo").textContent = Math.max(1, Math.round(nav.responseStart - nav.requestStart)) + " ms até a primeira resposta";
        }
        if (nav && nav.responseStatus) {
          $("status").textContent = nav.responseStatus + (nav.responseStatus === 200 ? " OK" : "");
        }
      } catch (e) {}

      $("copiar").addEventListener("click", function () {
        var url = location.origin && location.origin !== "null" ? location.origin : location.href;
        var done = function (ok) {
          $("feedback").textContent = ok ? "Endereço copiado!" : "Não deu para copiar. Selecione o endereço na barra do navegador.";
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(function () { done(true); }, function () { done(false); });
        } else {
          try {
            var t = document.createElement("textarea");
            t.value = url; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
            document.body.appendChild(t); t.select();
            var ok = document.execCommand("copy");
            document.body.removeChild(t); done(ok);
          } catch (e) { done(false); }
        }
      });
    })();
  </script>
</body>
</html>
